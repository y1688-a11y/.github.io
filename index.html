<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>收款</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
            background: linear-gradient(160deg, #e8f0fe 0%, #f5f7fa 50%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 28px 28px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 8px 32px rgba(22, 119, 255, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: #1677ff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #8c8c8c;
            margin-bottom: 28px;
        }

        .status-area {
            background: #f0f5ff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .status-text {
            font-size: 14px;
            color: #595959;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #d6e4ff;
            border-top-color: #1677ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .qrcode-wrap {
            display: none;
            margin-bottom: 16px;
        }

        .qrcode-wrap.show {
            display: block;
        }

        .qrcode-img {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
            object-fit: contain;
        }

        .qrcode-tip {
            font-size: 12px;
            color: #8c8c8c;
            margin-top: 10px;
            line-height: 1.5;
        }

        .btn-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-group.show {
            display: flex;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .btn-alipay {
            background: #1677ff;
            color: #ffffff;
        }

        .btn-alipay svg {
            width: 20px;
            height: 20px;
            margin-right: 6px;
            fill: currentColor;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: #d9d9d9;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #f0f0f0;
        }

        .divider span {
            padding: 0 12px;
        }

        .footer {
            font-size: 11px;
            color: #bfbfbf;
            line-height: 1.6;
        }

        .manual-link {
            display: none;
            margin-top: 12px;
        }

        .manual-link.show {
            display: block;
        }

        .manual-link a {
            font-size: 13px;
            color: #1677ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-row">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M20.5 15.5c-1.5-.5-3.5-1.2-5.7-2 .8-1.4 1.4-3 1.9-4.7h-4.1V7.3h5V6.2h-5V3.8h-2.1c-.4 0-.4.4-.4.4v2H6v1.1h4.1v1.5H6v1.1h8.3c-.3 1.1-.8 2.2-1.4 3.2-2.8-.9-5.8-1.7-7.7-1.2-1.2.3-2 .9-2.5 1.5-2 2.5-.5 6.3 3.8 6.3 2.5 0 4.9-1.4 6.6-3.7 2.6 1.2 7.8 3.2 7.8 3.2v-2.4s-1-.2-2.4-.5zM7.8 17.6c-3.1 0-4-1.9-2.8-2.7.4-.3 1.1-.5 1.6-.5 2 0 3.9.7 5.8 1.5-1.3 1-2.9 1.7-4.6 1.7z"/>
                </svg>
            </div>
            <span class="brand-name">支付宝收款</span>
        </div>

        <h1 class="title">请完成付款</h1>
        <p class="subtitle">安全便捷的支付方式</p>

        <div class="status-area">
            <p class="status-text" id="statusText">
                <span class="spinner" id="spinner"></span>
                <span id="statusMsg">正在跳转支付宝...</span>
            </p>
        </div>

        <div class="qrcode-wrap" id="qrcodeWrap">
            <img class="qrcode-img" src="https://aka.doubaocdn.com/s/S83jgg6JP1" alt="支付宝收款码">
            <p class="qrcode-tip">长按图片保存到相册<br>打开支付宝扫一扫付款</p>
        </div>

        <div class="btn-group" id="btnGroup">
            <a href="#" class="btn btn-alipay" id="alipayBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M20.5 15.5c-1.5-.5-3.5-1.2-5.7-2 .8-1.4 1.4-3 1.9-4.7h-4.1V7.3h5V6.2h-5V3.8h-2.1c-.4 0-.4.4-.4.4v2H6v1.1h4.1v1.5H6v1.1h8.3c-.3 1.1-.8 2.2-1.4 3.2-2.8-.9-5.8-1.7-7.7-1.2-1.2.3-2 .9-2.5 1.5-2 2.5-.5 6.3 3.8 6.3 2.5 0 4.9-1.4 6.6-3.7 2.6 1.2 7.8 3.2 7.8 3.2v-2.4s-1-.2-2.4-.5zM7.8 17.6c-3.1 0-4-1.9-2.8-2.7.4-.3 1.1-.5 1.6-.5 2 0 3.9.7 5.8 1.5-1.3 1-2.9 1.7-4.6 1.7z"/>
                </svg>
                立即支付
            </a>
        </div>

        <div class="manual-link" id="manualLink">
            <a href="#" id="manualBtn">跳转未响应？点击手动跳转</a>
        </div>

        <div class="divider">
            <span>支付说明</span>
        </div>

        <p class="footer">
            支付完成后请关闭本页面<br>
            如遇问题请联系收款方
        </p>
    </div>

    <script>
        // 收款链接配置
        var ALIPAY_URL = "https://ur.alipay.com/_4i4NC0Dr5blz1FLaZQtRxH";
        // 微信收款链接（如有请填入，没有则留空字符串）
        var WECHAT_URL = "";

        var ua = navigator.userAgent.toLowerCase();
        var isWechat = ua.indexOf("micromessenger") !== -1;
        var isAlipay = ua.indexOf("alipay") !== -1;

        var spinner = document.getElementById("spinner");
        var statusMsg = document.getElementById("statusMsg");
        var qrcodeWrap = document.getElementById("qrcodeWrap");
        var btnGroup = document.getElementById("btnGroup");
        var alipayBtn = document.getElementById("alipayBtn");
        var manualLink = document.getElementById("manualLink");
        var manualBtn = document.getElementById("manualBtn");

        alipayBtn.href = ALIPAY_URL;
        manualBtn.href = ALIPAY_URL;

        if (isWechat) {
            // 微信环境：无法直接唤起支付宝，展示收款码图片
            spinner.style.display = "none";
            statusMsg.textContent = "微信内无法直接跳转支付宝";
            qrcodeWrap.classList.add("show");
            btnGroup.classList.add("show");
        } else {
            // 支付宝环境或外部浏览器：自动跳转
            statusMsg.textContent = "正在跳转支付宝...";
            setTimeout(function() {
                window.location.href = ALIPAY_URL;
            }, 600);

            // 3秒后如果还没跳转，显示手动按钮
            setTimeout(function() {
                spinner.style.display = "none";
                statusMsg.textContent = "跳转未响应？";
                manualLink.classList.add("show");
                btnGroup.classList.add("show");
            }, 3000);
        }
    </script>
</body>
</html>
