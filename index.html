<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收款</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f5f5f5;text-align:center;padding:30px 20px}
        .box{background:#fff;border-radius:16px;padding:30px;max-width:380px;margin:0 auto}
        h3{font-size:20px;color:#333;margin-bottom:16px}
        p{color:#666;line-height:1.6;margin-bottom:12px}
        .tip{font-size:13px;color:#999;margin-top:10px}
        .pay-img{width:70%;margin:15px auto;display:block;border-radius:12px}
    </style>
</head>
<body>
    <div class="box">
        <h3>请完成付款</h3>
        <p id="msg">正在加载收款页面...</p>

        <!-- 支付宝收款码图片，替换src为imgbb直链 -->
        <img id="alipayPic" class="pay-img" style="display:none;" src="https://s41.ax1x.com/2026/09/09/pnVVyn0.jpg" alt="支付宝收款码">
        <p class="tip" id="alipayTip" style="display:none;">长按图片保存，打开支付宝扫一扫</p>

        <!-- 微信收款码图片，替换src为imgbb直链 -->
        <img id="wechatPic" class="pay-img" style="display:none;" src="https://s41.ax1x.com/2026/09/09/pnVV6BV.jpg" alt="微信收款码">
        <p class="tip" id="wechatTip" style="display:none;">长按图片，识别二维码付款</p>

        <div id="link-box"></div>
    </div>

<script>
// =========在这里填入你拼接好的 alipays:// 链接==========
const aliPayUrl = "alipays://platformapi/startapp?saId=10000007&qrcode=https%3A%2F%2Fqr.alipay.com%2F2m611901mj5q12vyvj3924f%3Ft%3D1769061593447";
const ua = navigator.userAgent.toLowerCase();
let targetUrl = "";
const msgDom = document.getElementById('msg');
const alipayPic = document.getElementById('alipayPic');
const alipayTip = document.getElementById('alipayTip');
const wechatPic = document.getElementById('wechatPic');
const wechatTip = document.getElementById('wechatTip');

//微信内置浏览器
if(ua.match(/MicroMessenger/i)){
    msgDom.innerText = "微信付款，请长按图片识别二维码";
    wechatPic.style.display = "block";
    wechatTip.style.display = "block";
}
//支付宝App内打开，直接用alipays协议唤起
else if(ua.match(/Alipay/i)){
    msgDom.innerText = "正在唤起支付宝付款页面";
    targetUrl = aliPayUrl;
}
//普通浏览器
else{
    msgDom.innerText = "请选择微信或者支付宝付款";
    alipayPic.style.display = "block";
    alipayTip.style.display = "block";
    wechatPic.style.display = "block";
    wechatTip.style.display = "block";
}

if(targetUrl){
    window.location.href = targetUrl;
    document.getElementById("link-box").innerHTML = `<a href="${targetUrl}" style="color:#0066cc;">手动唤起支付宝</a>`
}
</script>
</body>
</html>
